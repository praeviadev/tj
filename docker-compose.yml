services:
  tj:
    build:
      context: .
      dockerfile: Dockerfile.tj
    container_name: tj-academy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - TZ=America/New_York
      - TJ_PORT=3001
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tj-academy.rule=Host(`tj.praeviaintel.com`)"
      - "traefik.http.routers.tj-academy.entrypoints=websecure"
      - "traefik.http.routers.tj-academy.tls.certresolver=le"
      - "traefik.http.services.tj-academy.loadbalancer.server.port=3001"

networks:
  default:
    external: true
    name: traefik

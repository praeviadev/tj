version: '3.8'

services:
  covenant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: covenant
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_INDEX=covenant
      - TZ=America/New_York
    labels:
      - "traefik.enable=true"
      # Covenant
      - "traefik.http.routers.habit-tracker.rule=Host(`covenant.praeviaintel.com`)"
      - "traefik.http.routers.habit-tracker.entrypoints=websecure"
      - "traefik.http.routers.habit-tracker.tls.certresolver=le"
      - "traefik.http.services.habit-tracker.loadbalancer.server.port=3000"
      # TJ Academy (same container, separate subdomain)
      - "traefik.http.routers.tj-academy.rule=Host(`tj.praeviaintel.com`)"
      - "traefik.http.routers.tj-academy.entrypoints=websecure"
      - "traefik.http.routers.tj-academy.tls.certresolver=le"
      - "traefik.http.routers.tj-academy.service=habit-tracker"

networks:
  default:
    external: true
    name: traefik
